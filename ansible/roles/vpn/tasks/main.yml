- name: Install WireGuard
  apt:
    name:
      - wireguard
      - iptables
    state: present
    update_cache: yes

- name: Enable IPv4 forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: Deploy WireGuard config
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify: restart WireGuard

- name: Ensure WireGuard is enabled and started
  systemd:
    name: wg-quick@wg0
    enabled: yes
    state: started
